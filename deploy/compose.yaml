# NocoBase 2.2.37 (Apache-2.0 社区版) + PostgreSQL 16
# 用途：HRIS员工与转正管理系统，单机本地部署。
# 说明：数据库端口不向宿主机暴露；平台端口仅绑定 127.0.0.1。
# 版本来源见 docs/operations/VERSIONS.md；镜像使用阿里云 NocoBase 官方镜像源。

name: hris

services:
  app:
    image: registry.cn-shanghai.aliyuncs.com/nocobase/nocobase:2.2.37-full
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY:?请在 .env 中设置 APP_KEY}
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: ${APP_HOST_PORT:-13000}
      TZ: ${TZ:-Asia/Shanghai}
      # 首次启动初始化管理员（仅在尚未安装时生效）
      INIT_APP_LANG: ${INIT_APP_LANG:-zh-CN}
      INIT_ROOT_EMAIL: ${INIT_ROOT_EMAIL:?请在 .env 中设置 INIT_ROOT_EMAIL}
      INIT_ROOT_PASSWORD: ${INIT_ROOT_PASSWORD:?请在 .env 中设置 INIT_ROOT_PASSWORD}
      INIT_ROOT_NICKNAME: ${INIT_ROOT_NICKNAME:-平台管理员}
      INIT_ROOT_USERNAME: ${INIT_ROOT_USERNAME:-admin}
      # 数据库
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-nocobase}
      DB_USER: ${POSTGRES_USER:-nocobase}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - app_storage:/app/nocobase/storage
      # 自研最小 HRIS 插件（S3），以只读方式挂载；目录不存在时 compose 会自动创建
      - ../packages/plugins:/app/nocobase/storage/plugins:ro
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-13000}:80"
    networks:
      - hris

  postgres:
    # 精确锁定：:16 浮动主版本标签 + 已核验镜像 digest（PostgreSQL 16.3）。
    # digest 优先于标签，保证部署与恢复使用同一镜像。
    image: registry.cn-shanghai.aliyuncs.com/nocobase/postgres:16@sha256:dc0dc485abfdd0901b10af592ccc3c25ed821936a962969b99d3b488e24edd39
    restart: unless-stopped
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nocobase} -d ${POSTGRES_DB:-nocobase}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - hris
    # 数据库不向宿主机暴露端口

volumes:
  app_storage:
  db_data:

networks:
  hris:
